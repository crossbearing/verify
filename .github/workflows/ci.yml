# The verifier's bar: format, vet, tests against real engine-produced
# fixtures held to a coverage floor, a fuzz smoke on the document parser,
# and govulncheck at a pinned version. The dependency check is the product
# property made mechanical: go.sum must not exist, because the standard
# library is the entire supply chain.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The govulncheck gate below is only true as of the last push. A CVE disclosed
  # against an unchanged tree — including one in the pinned Go toolchain, which
  # is how GO-2026-4970 and GO-2026-5856 sat here unnoticed — is invisible until
  # someone happens to commit. Re-run the whole gate weekly. Mondays 07:00 UTC;
  # the org's repos are staggered by 30 minutes.
  schedule:
    - cron: "0 7 * * 1"
  # and on demand, for when an advisory lands and waiting until Monday is wrong
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: zero dependencies
        run: test ! -f go.sum || { echo "go.sum exists — the supply chain is no longer just the stdlib"; exit 1; }

      - name: gofmt
        if: ${{ !cancelled() }}
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        if: ${{ !cancelled() }}
        run: go vet ./...

      - name: go test + coverage floor
        if: ${{ !cancelled() }}
        env:
          # The org floor is 75% of statements. These two packages carry the
          # signature verification and the fail-closed exit, which the testing
          # rubric singles out as security-critical and asks for 100% on.
          #
          # 100% is not attainable here without deleting correct code. Three
          # statements in aep are unreachable by construction: two `.(string)`
          # assertions on JSON object keys, which the decoder guarantees are
          # strings, and one compact() error on bytes already validated. main()
          # is likewise uncoverable, being the os.Exit wrapper around run().
          #
          # So the floor is set high enough to catch a real regression and low
          # enough not to demand the removal of defensive code. Raise it when
          # coverage genuinely rises; never lower it to make a red build green.
          FLOOR: "95.0"
        run: |
          set -o pipefail

          # Without pipefail the exit status of a pipeline is tee's, so a
          # failing test suite would be reported as a passing step. Captured
          # explicitly as well, so a test failure and a coverage shortfall are
          # both reported instead of the first one masking the second.
          test_rc=0
          go test ./... -count=1 -covermode=atomic -coverprofile=cover.out | tee cover.log || test_rc=$?

          rc=0
          if [ "$test_rc" -ne 0 ]; then
            echo "::error::go test failed (exit $test_rc)"
            rc=1
          fi

          seen=0
          while read -r line; do
            case "$line" in
              *coverage:*) ;;
              *) continue ;;
            esac
            seen=$((seen + 1))

            # The package name is pulled by pattern, not by field number: a
            # tested package prints "ok <pkg> <time> coverage: N%" while an
            # untested one prints "<pkg> coverage: 0.0%", so $2 means different
            # things on the two shapes.
            pkg=$(printf '%s' "$line" | grep -o 'github\.com/[^[:space:]]*' || true)
            pct=$(printf '%s' "$line" | sed -n 's/.*coverage: \([0-9.]*\)%.*/\1/p')

            # A line that cannot be parsed is a failure, never a pass. Reading
            # an unparseable result as "above the floor" is the vacuous pass
            # this gate exists to prevent.
            if [ -z "$pkg" ] || [ -z "$pct" ]; then
              echo "::error::cannot parse coverage line: $line"
              rc=1
              continue
            fi

            # Values go to awk as variables, never interpolated into the
            # program text: an empty or malformed value must not become a
            # syntax error whose non-zero exit reads as success.
            if awk -v p="$pct" -v f="$FLOOR" 'BEGIN { exit !(p + 0 < f + 0) }'; then
              echo "::error::$pkg at ${pct}% is below the ${FLOOR}% floor"
              rc=1
            else
              echo "ok  $pkg ${pct}% >= ${FLOOR}%"
            fi
          done < cover.log

          # A package that reports nothing at all would otherwise pass unchecked.
          expected=$(go list ./... | wc -l | tr -d ' ')
          if [ "$seen" -ne "$expected" ]; then
            echo "::error::coverage reported for $seen of $expected packages"
            rc=1
          fi

          exit $rc

      - name: fuzz smoke (15s)
        if: ${{ !cancelled() }}
        run: go test ./aep -run '^$' -fuzz FuzzVerify -fuzztime 15s

      - name: govulncheck
        if: ${{ !cancelled() }}
        # The annotation must sit immediately above the run line and the version
        # must stay inline after the @: the org preset's customManager matches
        # `<annotation>\n<line containing go run …@version>`, so anything in
        # between — including the `if:` above — puts the two on non-adjacent
        # lines and the manager silently matches nothing.
        #
        # datasource=go resolves against the module proxy, which is what `go run`
        # itself uses. Not github-releases: golang/vuln stopped cutting Release
        # objects after v1.1.4 while continuing to tag, so that datasource would
        # watch a source frozen six minor versions behind this pin.
        #
        # depName is the module path, not the package path — the proxy knows
        # golang.org/x/vuln, not golang.org/x/vuln/cmd/govulncheck.
        # renovate: datasource=go depName=golang.org/x/vuln
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
